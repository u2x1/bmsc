name: unit tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Analyze & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.2' # 与本地开发环境一致，避免 stable 漂移导致本地过/CI 挂
          cache: true

      - run: flutter --version

      - name: Pub Get
        run: flutter pub get

      - name: Analyze (lib + test)
        run: flutter analyze --no-pub lib test

      - name: Unit tests
        run: flutter test test/unit

      # integration 目录为真实网络测试，CI 永不执行：
      # 1) 只跑 test/unit；2) 静态断言集成测试文件保留 live 门控（防误提交失效）
      - name: Assert live gate present in integration tests
        run: |
          if grep -q "skip: !isLive" test/integration/api_live_test.dart; then
            echo "OK: live gate present, integration never runs in CI"
          else
            echo "::error::live 门控缺失（skip: !isLive），勿在 CI 中执行真实 B 站接口"
            exit 1
          fi