name: build release artifacts

on:
  push:
    tags:
      # 正式发版 vX.Y.Z：构建并创建 GitHub Release（用户会收到更新提示）
      - "v*.*.*"
      # 测试构建 tag（如 v1.17.0-test.1，会被上面的 v*.*.* 匹配）：
      # 只构建并上传 workflow artifact，不创建 Release、不触发用户更新提示
      - "v*.*.*-*"

jobs:
  test:
    name: Unit Tests Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.2' # 与本地开发环境一致
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub lib test
      - name: Unit tests
        run: flutter test test/unit

  build:
    name: Build Artifacts and Release
    needs: test # 发版门禁：单元测试不过不构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        # ubuntu-latest 镜像更新后 apt 缓存过期，不 update 会 404 (exit 100)
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential ninja-build cmake pkg-config libgtk-3-dev
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.2' # 与本地开发环境一致

      - run: flutter --version

      - uses: olegtarasov/get-tag@v2.1.4
        id: tagName
        with:
          tagRegex: 'v([0-9]+.[0-9]+.[0-9]+)'
          tagRegexGroup: 1

      - name: Replace YAML version with tag version
        run: |
          sed -i 's/99.99.99/'$GIT_TAG_NAME'/g' pubspec.yaml|
          echo "Tag used version:"$GIT_TAG_NAME

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Pub Get Packages
        run: flutter pub get

      - name: Build apks
        run: flutter build apk --release --split-per-abi
      
      - name: Build linux executable
        run: flutter build linux --release

      - name: Extract Changelog
        id: changelog
        run: |
          VERSION_V="${{ steps.tagName.outputs.tag }}"
          VERSION=$(echo $VERSION_V | sed 's/^v//')
          echo "Extracting changelog for version $VERSION"
          awk "/^# $VERSION\$/{p=1;next} /^# /{p=0} p" changelog.md > changelog_content.txt
          echo "got changelog content"
          cat changelog_content.txt
          echo "changelog<<EOF" >> $GITHUB_ENV
          cat changelog_content.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Prepare Release Files
        run: |
          cd build/app/outputs/flutter-apk/
          mv app-arm64-v8a-release.apk ${{ github.event.repository.name }}-v${{ steps.tagName.outputs.tag }}-arm64.apk
          mv app-armeabi-v7a-release.apk ${{ github.event.repository.name }}-v${{ steps.tagName.outputs.tag }}-arm32.apk
          mv app-x86_64-release.apk ${{ github.event.repository.name }}-v${{ steps.tagName.outputs.tag }}-x64.apk
          cd ../../../..
          cd build/linux/x64/release/bundle/
          zip -r ${{ github.event.repository.name }}-v${{ steps.tagName.outputs.tag }}-linux.zip .
          mv ${{ github.event.repository.name }}-v${{ steps.tagName.outputs.tag }}-linux.zip ../../../../../

      - name: Determine release tag
        id: rel
        run: |
          # 仅严格 vX.Y.Z 形式的 tag 创建 Release；
          # 带后缀的测试 tag（vX.Y.Z-*）跳过发版，避免用户收到更新提示
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Github Release
        if: steps.rel.outputs.is_release == 'true'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          replacesArtifacts: true
          artifacts: |
            build/app/outputs/flutter-apk/${{ github.event.repository.name }}-v${{ steps.tagName.outputs.tag }}-arm64.apk
            build/app/outputs/flutter-apk/${{ github.event.repository.name }}-v${{ steps.tagName.outputs.tag }}-arm32.apk
            build/app/outputs/flutter-apk/${{ github.event.repository.name }}-v${{ steps.tagName.outputs.tag }}-x64.apk
            ${{ github.event.repository.name }}-v${{ steps.tagName.outputs.tag }}-linux.zip
          token: ${{ secrets.PERSONAL_RELEASE_TOKEN }}
          body: ${{ env.changelog }}

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            build/app/outputs/flutter-apk/${{ github.event.repository.name }}-v${{ steps.tagName.outputs.tag }}-arm64.apk
            build/app/outputs/flutter-apk/${{ github.event.repository.name }}-v${{ steps.tagName.outputs.tag }}-arm32.apk
            build/app/outputs/flutter-apk/${{ github.event.repository.name }}-v${{ steps.tagName.outputs.tag }}-x64.apk
            ${{ github.event.repository.name }}-v${{ steps.tagName.outputs.tag }}-linux.zip

  build-ios:
    name: Build Unsigned IPA
    needs: test # 与 build 并行；iOS 构建不需要 Android keystore 等机密
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.2' # 与本地开发环境一致
          cache: true

      - uses: olegtarasov/get-tag@v2.1.4
        id: tagName
        with:
          tagRegex: 'v([0-9]+.[0-9]+.[0-9]+)'
          tagRegexGroup: 1

      - name: Replace YAML version with tag version
        # 不替换的话 App 内 package_info 读到占位版本 99.99.99，
        # 更新检查会误报；macOS 的 sed 需要 -i ''
        run: |
          sed -i '' "s/99.99.99/${GIT_TAG_NAME}/g" pubspec.yaml
          echo "Tag used version: ${GIT_TAG_NAME}"

      - name: Pub Get Packages
        run: flutter pub get

      - name: Build ios (no codesign)
        # 未签名构建：不配置证书/provisioning，产出 Runner.app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned ipa
        # 标准 IPA 结构：Payload/Runner.app 打包为 zip；
        # 供 AltStore/SideStore/Sideloadly/TrollStore 等重签名后侧载
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr ${{ github.event.repository.name }}-v${{ steps.tagName.outputs.tag }}-unsigned.ipa Payload

      - name: Determine release tag
        id: rel
        run: |
          # 仅严格 vX.Y.Z 形式附到 Release；测试 tag 只传 workflow artifact
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach ipa to release
        # 与 build job 并行执行，Release 由 build job 创建；
        # 轮询等待 Release 出现后再追加 ipa（gh 追加不触碰其他产物）
        if: steps.rel.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_RELEASE_TOKEN }}
        run: |
          for i in $(seq 1 60); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" \
                ${{ github.event.repository.name }}-v${{ steps.tagName.outputs.tag }}-unsigned.ipa --clobber
              exit 0
            fi
            echo "waiting for release $GITHUB_REF_NAME ... ($i/60)"
            sleep 10
          done
          echo "release not found after waiting" >&2
          exit 1

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ${{ github.event.repository.name }}-v${{ steps.tagName.outputs.tag }}-unsigned.ipa
